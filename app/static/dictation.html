<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wisp dictation</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }

      /* The pill is hidden until Rust toggles `html.on` on key-down (see window.wispIndicator). */
      .pill {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 14px 7px 10px;
        color: #f3efe9;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1px;
        background: rgba(28, 27, 26, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        opacity: 0;
        transform: translateY(6px) scale(0.96);
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      html.on .pill {
        opacity: 1;
        transform: none;
      }

      .mark {
        width: 20px;
        height: 20px;
        flex: none;
        display: block;
      }

      /* A soft pulsing ring, so "listening" reads even without the text. */
      .dot {
        width: 7px;
        height: 7px;
        flex: none;
        border-radius: 50%;
        background: #c96442;
        margin-left: 1px;
        animation: ping 1.4s ease-out infinite;
      }
      @keyframes ping {
        0% {
          box-shadow: 0 0 0 0 rgba(201, 100, 66, 0.5);
        }
        70%,
        100% {
          box-shadow: 0 0 0 7px rgba(201, 100, 66, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pill {
          transition: none;
        }
        .dot {
          animation: none;
        }
      }
    </style>
  </head>

      <span>Listening…</span>
      <span class="dot"></span>
    </div>
    <script>
      // Rust flips this on key-down/up via WebviewWindow::eval. Keeping it a function (rather than
      // show/hide-ing the window) means the overlay never takes focus from the app you're dictating
      // into, so the paste still lands there.
      window.wispIndicator = function (on) {
        document.documentElement.classList.toggle("on", !!on);
      };
    </script>
